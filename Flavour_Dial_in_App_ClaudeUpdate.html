<body class="bg-[#F5F5F5] text-[#333333] selection:bg-[#3E1F47] selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Coffee Profile State
      const [roasterName, setRoasterName] = useState('');
      const [coffeeName, setCoffeeName] = useState('');
      const [roastLevel, setRoastLevel] = useState('medium');

      // Shot Mechanics State
      const [doseIn, setDoseIn] = useState(18);
      const [yieldOut, setYieldOut] = useState(36);
      const [grindSetting, setGrindSetting] = useState('15');
      const [shotTime, setShotTime] = useState(28);
      const [brewTemp, setBrewTemp] = useState('medium');
      const [burrType, setBurrType] = useState('conical');
      const [puckPrep, setPuckPrep] = useState('wdt_tamp');
      const [puckScreen, setPuckScreen] = useState(false);

      // Taste Feedback State (Set of selected tasting notes)
      const [selectedNotes, setSelectedNotes] = useState(new Set());

      // Results State
      const [diagnosis, setDiagnosis] = useState(null);

      // Shot History (persisted to localStorage)
      const HISTORY_KEY = 'brevista_dialin_history_v2';
      const [shotHistory, setShotHistory] = useState([]);
      const [showHistory, setShowHistory] = useState(false);
      const [inputError, setInputError] = useState('');

      useEffect(() => {
        try {
          const raw = window.localStorage.getItem(HISTORY_KEY);
          if (raw) setShotHistory(JSON.parse(raw));
        } catch (e) {
          console.warn('Could not load shot history:', e);
        }
      }, []);

      const saveHistoryEntry = (entry) => {
        try {
          const updated = [entry, ...shotHistory].slice(0, 50);
          setShotHistory(updated);
          window.localStorage.setItem(HISTORY_KEY, JSON.stringify(updated));
        } catch (e) {
          console.warn('Could not save shot history:', e);
        }
      };

      const clearHistory = () => {
        let confirmed = true;
        try {
          confirmed = window.confirm('Clear all saved shot history? This cannot be undone.');
        } catch (e) {
          confirmed = true; // if confirm() is blocked by the environment, proceed rather than silently failing
        }
        if (!confirmed) return;
        setShotHistory([]);
        try { window.localStorage.removeItem(HISTORY_KEY); } catch (e) {}
      };

      // Taste Dictionary
      const TasteDictionary = {
        extraction: {
          under: ['sour', 'sharp', 'lemon', 'vegetal', 'salty', 'vinegar'],
          over: ['bitter', 'ashy', 'dry', 'burnt', 'astringent', 'medicinal']
        },
        balanced: {
          light: ['berry', 'citrus', 'floral', 'jasmine', 'tropical', 'tea-like'],
          medium: ['chocolate', 'caramel', 'honey', 'vanilla', 'nuts', 'malty'],
          dark: ['chocolate', 'caramel', 'vanilla', 'nuts', 'malty', 'buttery']
        },
        body: {
          weak: ['watery', 'thin'],
          optimal: ['medium', 'syrupy'], // Syrupy is ideal, registers neutral body score
          heavy: ['heavy', 'overpowering']
        },
        isNoteInCategory: function(note, categoryArray) {
          return categoryArray.includes(note.toLowerCase());
        }
      };

      const getNotesForRoast = (roast) => {
        return TasteDictionary.balanced[roast] || TasteDictionary.balanced.medium;
      };

      const toggleNote = (note) => {
        const updated = new Set(selectedNotes);
        if (updated.has(note)) {
          updated.delete(note);
        } else {
          updated.add(note);
        }
        setSelectedNotes(updated);
      };

      // Puck prep "readiness level" - used to decide whether channeling advice
      // should escalate to "slow feed the grinder" vs. "improve your prep first".
      // Blind Shaker + WDT + Tamp = 3 (max manual prep). A puck screen adds +1
      // since it further evens flow distribution independent of the prep method.
      const getPrepLevel = (prep, screen) => {
        const base = { tamp: 1, wdt_tamp: 2, shaker_tamp: 2, shaker_wdt_tamp: 3 }[prep] || 1;
        return base + (screen ? 1 : 0);
      };

      // Shot-time thresholds scale with ratio (dose/yield).
      // Research (ristretto/lungo breakdown):
      // - Ristretto (1:1–1.5): 20–30s depending on roast
      // - Lungo (1:3+):        30–40s (or 10–15s for turbo style)
      // 
      // For a given ratio R, a simple model:
      //   fastShotThreshold = 12 + (4 * R)  [ristretto pulls should be 20–25s]
      //   slowShotThreshold = 25 + (7 * R)  [lungo pulls should be 30–40s]
      //
      // Examples:
      //   1:1 ristretto:  12+4=16s (fast), 25+7=32s (slow) → typical 20-25s range ✓
      //   1:2 medium:     12+8=20s (fast), 25+14=39s (slow) → typical 28-32s range ✓
      //   1:3 lungo:      12+12=24s (fast), 25+21=46s (slow) → typical 30-35s range ✓
      const getRatioAwareShotTimeThresholds = (dose, yield_) => {
        if (!dose || dose <= 0 || !yield_ || yield_ <= 0) {
          return { fastThreshold: 18, slowThreshold: 40 }; // safe defaults
        }
        const ratio = yield_ / dose;
        return {
          fastThreshold: Math.max(12, 12 + (4 * ratio)),
          slowThreshold: Math.max(25, 25 + (7 * ratio))
        };
      };

      const analyzeShot = () => {
        setInputError('');

        if (selectedNotes.size === 0) {
          alert("Please select at least one taste note to diagnose the shot.");
          return;
        }

        if (!doseIn || doseIn <= 0 || !yieldOut || yieldOut <= 0) {
          setInputError('Dose In and Yield Out must both be greater than 0 before diagnosing.');
          return;
        }

        const notesArray = Array.from(selectedNotes);

        // 1. Scoring Engine
        let underScore = 0;
        let overScore = 0;
        let balancedScore = 0;
        let bodyScore = 0;

        const balancedNotes = getNotesForRoast(roastLevel);

        notesArray.forEach(note => {
          const lower = note.toLowerCase();
          if (TasteDictionary.isNoteInCategory(lower, TasteDictionary.extraction.under)) underScore++;
          if (TasteDictionary.isNoteInCategory(lower, TasteDictionary.extraction.over)) overScore++;
          if (TasteDictionary.isNoteInCategory(lower, balancedNotes)) balancedScore++;

          if (TasteDictionary.isNoteInCategory(lower, TasteDictionary.body.weak)) bodyScore--;
          if (TasteDictionary.isNoteInCategory(lower, TasteDictionary.body.heavy)) bodyScore++;
        });

        const extractionIndex = balancedScore - (underScore + overScore);

        // Contradictory body notes (e.g. "watery" + "heavy") cancel out silently
        // in bodyScore. Surface it as a warning rather than hiding it.
        const warnings = [];
        const hasWeakBody = notesArray.some(n => TasteDictionary.isNoteInCategory(n.toLowerCase(), TasteDictionary.body.weak));
        const hasHeavyBody = notesArray.some(n => TasteDictionary.isNoteInCategory(n.toLowerCase(), TasteDictionary.body.heavy));
        if (hasWeakBody && hasHeavyBody) {
          warnings.push('You selected contradictory body notes (e.g. watery + heavy). These cancel out in the body score below - consider re-tasting to isolate the dominant mouthfeel before adjusting dose/yield.');
        }

        // 2. Channeling Engine
        let channelingScore = 0;
        let specificContradictions = [];

        if (underScore > 0 && overScore > 0) {
          channelingScore += (underScore + overScore);
        }

        // Use the full extraction word-lists (not a narrower hardcoded subset)
        // so the contradiction check stays consistent with the scoring engine.
        const hasSour = notesArray.some(n => TasteDictionary.isNoteInCategory(n.toLowerCase(), TasteDictionary.extraction.under));
        const hasBitter = notesArray.some(n => TasteDictionary.isNoteInCategory(n.toLowerCase(), TasteDictionary.extraction.over));

        if (hasSour && hasBitter) {
          specificContradictions.push('Under-extraction + Over-extraction notes together');
          channelingScore += 2;
        }

        // Objective flow-time signal: very fast shots point to channeling
        // regardless of which taste notes were selected.
        let fastShotFlag = false;
        if (shotTime && shotTime <= fastThreshold) {
          fastShotFlag = true;
          channelingScore += 2;
          specificContradictions.push(`Fast shot time (${shotTime}s, threshold for 1:${(yieldOut / doseIn).toFixed(1)} is ~${fastThreshold.toFixed(0)}s)`);
        }

        const isChanneling = channelingScore >= 2;
        const prepLevel = getPrepLevel(puckPrep, puckScreen);

        // Apply ratio-aware shot-time thresholds
        const { fastThreshold, slowThreshold } = getRatioAwareShotTimeThresholds(doseIn, yieldOut);

        // 3. Recommendation Engine (Priority Ladder)
        let recs = [];

        // Priority 1: Channeling
        if (isChanneling) {
          if (prepLevel >= 4) {
            recs.push({
              priority: 1,
              category: 'Grinder / Prep',
              action: 'Slow Feed Grinder',
              details: `Contradictory flavors detected (${specificContradictions.join(', ') || 'Mixed extraction signals'}). Your puck prep is already at its practical maximum (${puckScreen ? 'incl. puck screen' : 'no puck screen'}). Slow-feed beans into your hopper to reduce micro-fines and prevent channeling.`
            });
          } else {
            recs.push({
              priority: 1,
              category: 'Puck Prep',
              action: 'Improve Density & Distribution',
              details: `Channeling detected (${specificContradictions.join(', ') || 'Mixed extraction signals'}). Water is finding the path of least resistance. Use WDT (and a puck screen if you have one) plus a level tamp before changing grind size.`
            });
          }
        } else {
          // Dark Roast / Commodity Exception Logic
          if (roastLevel === 'dark' && overScore > 0) {
            recs.push({
              priority: 2,
              category: 'Yield',
              action: 'Shorten Ratio (Ristretto)',
              details: 'Dark roasts extract fast and bitter plant fibers dissolve easily. Stop the shot earlier (e.g., 1:1.25 ratio) to amputate the bitter tail-end.'
            });
            recs.push({
              priority: 3,
              category: 'Grind',
              action: 'Grind Coarser',
              details: 'Coarsening the grind speeds up flow and prevents harsh, drying over-extraction.'
            });
            if (brewTemp !== 'low') {
              recs.push({
                priority: 4,
                category: 'Temperature',
                action: 'Lower Temperature',
                details: 'High heat pulls ashy flavors from dark roasts. Drop your machine temperature to 91°C or lower.'
              });
            }
          } else {
            // Standard Extraction Index Logic
            if (extractionIndex < 0) {
              if (underScore > overScore) {
                // Very slow shots alongside sourness are unusual (slow flow
                // normally over-extracts). Flag it as a diagnostic anomaly
                // rather than just issuing the default "grind finer" advice.
                if (shotTime && shotTime >= slowThreshold) {
                  recs.push({
                    priority: 2,
                    category: 'Diagnostic Note',
                    action: 'Unusual: Slow + Sour',
                    details: `Your shot ran long (${shotTime}s, threshold is ~${slowThreshold.toFixed(0)}s) but still tastes under-extracted. This combination is uncommon - check for late-stage channeling (fast start, slow finish), an uneven/too-fine grind, or a temperature drop mid-shot before defaulting to "grind finer."`
                  });
                }
                recs.push({
                  priority: 2,
                  category: 'Grind',
                  action: 'Grind Finer',
                  details: 'Increases surface area and contact time to pull out more sweetness and balance the sour acidity. Try roughly 1-2 clicks finer on a stepped grinder, or a small increment on a stepless burr - then re-taste before moving further.'
                });
                if (bodyScore > 0) {
                  recs.push({
                    priority: 3,
                    category: 'Yield',
                    action: 'Increase Yield (Ratio)',
                    details: 'Your shot is thick but under-extracted. Pull a slightly longer shot (more water) to extract sweetness.'
                  });
                }
              } else if (overScore > underScore) {
                const isChoking = shotTime && shotTime >= slowThreshold;
                recs.push({
                  priority: isChoking ? 1.5 : 2,
                  category: 'Grind',
                  action: isChoking ? 'Grind Coarser (Choking Likely)' : 'Grind Coarser',
                  details: isChoking
                    ? `Shot time was ${shotTime}s (threshold is ~${slowThreshold.toFixed(0)}s) - this slow a flow usually means the grind is too fine or the puck is clumped, driving over-extraction. Grind noticeably coarser (more than a routine adjustment) and check for clumps before dosing next time.`
                    : 'Speeds up the flow to prevent the water from extracting bitter plant fibers. Try roughly 1-2 clicks coarser on a stepped grinder, or a small increment on a stepless burr - then re-taste before moving further.'
                });
                if (bodyScore < 0) {
                  recs.push({
                    priority: 3,
                    category: 'Yield',
                    action: 'Decrease Yield (Ratio)',
                    details: 'Pull a shorter shot to cut it off before the bitter tail-end dilutes the body.'
                  });
                }
              }
            } else if (extractionIndex >= 0 && (underScore > 0 || overScore > 0)) {
              // The balanced notes are outweighing a real but minor under/over
              // signal. Previously this was silently masked - surface it as a
              // low-priority note instead of hiding it.
              recs.push({
                priority: 6,
                category: 'Minor Note',
                action: underScore > overScore ? 'Slight Under-Extraction' : 'Slight Over-Extraction',
                details: `Overall the shot reads as balanced, but you also flagged ${underScore > overScore ? 'a mild sour/sharp note' : 'a mild bitter/dry note'} alongside the balanced ones. Not urgent - only chase this if you want to fine-tune further.`
              });
            }

            // Body / Concentration Fixes
            if (extractionIndex >= 0 && bodyScore !== 0) {
              if (bodyScore < 0) {
                recs.push({
                  priority: 3,
                  category: 'Yield / Dose',
                  action: 'Decrease Yield or Up Dose',
                  details: 'Taste is balanced but the body is watery. Pull slightly less liquid, or increase your dose by 0.5g for more concentration.'
                });
              } else if (bodyScore > 0) {
                recs.push({
                  priority: 3,
                  category: 'Yield',
                  action: 'Increase Yield',
                  details: 'The shot is overpowering and muddy. Push a little more water through to open up the flavors and lighten the texture.'
                });
              }
            }

            // Temperature Tweaks
            if (roastLevel === 'light' && underScore > 0 && brewTemp !== 'high') {
              recs.push({
                priority: 4,
                category: 'Temperature',
                action: 'Increase Temperature',
                details: 'Light roasts are dense. High heat (93°C+) is required to extract stubborn fruity/floral notes.'
              });
            }
          }

          // Burr Type Hardware Adaptations
          if (burrType === 'flat' && bodyScore < 0) {
            recs.push({
              priority: 5,
              category: 'Hardware Profile',
              action: 'Expect Less Texture',
              details: 'Flat burrs excel at sharp flavor clarity but inherently produce less velvety body than conical burrs. A slightly thinner mouthfeel is normal if flavor is balanced.'
            });
          } else if (burrType === 'conical' && roastLevel === 'light' && underScore > 0) {
            recs.push({
              priority: 5,
              category: 'Hardware Profile',
              action: 'Clarity Limits',
              details: 'Conical burrs create great texture but tend to blend flavors together. If you are struggling to get sharp fruit clarity from this light roast, you may be hitting your burr limits.'
            });
          }
        }

        // Success Fallback
        if (recs.length === 0) {
          recs.push({
            priority: 1,
            category: 'Success',
            action: 'Lock it in!',
            details: 'Your Extraction Index is perfectly balanced. Save this recipe in your logbook.'
          });
        }

        recs.sort((a, b) => a.priority - b.priority);

        const ratioStr = `1:${(yieldOut / doseIn).toFixed(1)}`;

        const newDiagnosis = {
          extractionIndex,
          bodyScore,
          isChanneling,
          warnings,
          ratio: ratioStr,
          grindSetting: grindSetting || '-',
          recommendations: recs
        };

        saveHistoryEntry({
          timestamp: new Date().toISOString(),
          roasterName: roasterName || '-',
          coffeeName: coffeeName || '-',
          roastLevel,
          doseIn,
          yieldOut,
          ratio: ratioStr,

          shotTime: shotTime || null,
          notes: notesArray,
          extractionIndex,
          bodyScore,
          isChanneling,
          topAction: recs[0] ? recs[0].action : '-'
        });
      };

      const resetForm = () => {
        setSelectedNotes(new Set());
        setDiagnosis(null);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

              </svg>
              <span className="text-xl font-bold tracking-tight text-[#3E1F47]" style={{ fontFamily: 'Montserrat, sans-serif' }}>
                Bre<span className="font-semibold">Vista</span> <span className="text-gray-400 font-normal">Studio</span>

                      </div>

          ) : (

                    <button
                      key={note}
                      onClick={() => toggleNote(note)}
                      className={`px-4 py-2 rounded-full border text-sm font-semibold transition-all cursor-pointer ${
                        selectedNotes.has(note)
                          ? 'bg-[#3E1F47] text-white border-[#3E1F47] shadow-sm scale-95'
                          : 'bg-white text-gray-700 border-gray-200 hover:border-gray-300 shadow-xs'
                      }`}
                    >
                      {note.charAt(0).toUpperCase() + note.slice(1)}
                    </button>
                  ))}
                </div>
              </div>

              {/* Body & Texture */}
              <div className="space-y-2">
                <h4 className="text-xs font-bold text-purple-600 uppercase tracking-wider">Body & Mouthfeel</h4>
                <div className="flex flex-wrap gap-2">
                  {[...TasteDictionary.body.weak, ...TasteDictionary.body.optimal, ...TasteDictionary.body.heavy].map(note => (
                    <button
                      key={note}
                      onClick={() => toggleNote(note)}
                      className={`px-4 py-2 rounded-full border text-sm font-semibold transition-all cursor-pointer ${
                        selectedNotes.has(note)
                          ? 'bg-[#3E1F47] text-white border-[#3E1F47] shadow-sm scale-95'
                          : 'bg-white text-gray-700 border-gray-200 hover:border-gray-300 shadow-xs'
                      }`}
                    >
                      {note.charAt(0).toUpperCase() + note.slice(1)}
                    </button>
                  ))}
                </div>
              </div>

              <div className="pt-4 flex gap-4">
                <button 
                  onClick={analyzeShot}
                  className="flex-1 bg-[#3E1F47] text-white py-4 rounded-2xl font-bold shadow-md hover:bg-[#2e1736] transition-all cursor-pointer text-center"
                >
                  Diagnose Shot
                </button>
                <button 
                  onClick={resetForm}
                  className="px-6 bg-gray-100 text-gray-600 py-4 rounded-2xl font-bold hover:bg-gray-200 transition-all cursor-pointer"
                >
                  Reset
                </button>
              </div>
            </section>

            {/* Results Modal / Panel */}
            {diagnosis && (
              <section className="bg-white p-6 rounded-3xl shadow-lg border-2 border-[#3E1F47] space-y-6 animate-fade-in">
                <div className="flex justify-between items-center border-b border-gray-100 pb-4">
                  <div>
                    <span className="text-xs font-bold uppercase tracking-widest text-[#777777]">Diagnosis Results</span>
                    <h3 className="text-2xl font-extrabold text-[#3E1F47]">Action Plan</h3>
                  </div>
                  <div className="flex gap-2 text-right">
                    <div className="bg-gray-50 px-3 py-1.5 rounded-xl border border-gray-200">
                      <span className="block text-[10px] text-gray-400 uppercase font-bold">Ratio</span>
                      <span className="text-sm font-extrabold text-[#3E1F47]">{diagnosis.ratio}</span>
                    </div>
                    <div className="bg-gray-50 px-3 py-1.5 rounded-xl border border-gray-200">
                      <span className="block text-[10px] text-gray-400 uppercase font-bold">Grind</span>
                      <span className="text-sm font-extrabold text-[#3E1F47]">{diagnosis.grindSetting}</span>
                    </div>
                  </div>
                </div>

                {diagnosis.warnings && diagnosis.warnings.length > 0 && diagnosis.warnings.map((w, i) => (
                  <div key={i} className="bg-blue-50 border border-blue-200 p-4 rounded-2xl flex items-start gap-3">
                    <span className="text-blue-600 font-bold text-lg">ℹ️</span>
                    <div>
                      <h4 className="text-sm font-bold text-blue-900">Input Note</h4>
                      <p className="text-xs text-blue-700 mt-0.5">{w}</p>
                    </div>
                  </div>
                ))}

                {diagnosis.isChanneling && (
                  <div className="bg-amber-50 border border-amber-200 p-4 rounded-2xl flex items-start gap-3">
                    <span className="text-amber-600 font-bold text-lg">⚠️</span>
                    <div>
                      <h4 className="text-sm font-bold text-amber-900">Channeling Detected</h4>
                      <p className="text-xs text-amber-700 mt-0.5">Conflicting extraction signals (fast flow and/or simultaneous sourness/bitterness) indicate water bypassing parts of the coffee puck.</p>
                    </div>
                  </div>
                )}

                <div className="space-y-3">
                  <h4 className="text-xs font-bold text-gray-400 uppercase tracking-wider">Recommended Adjustments</h4>
                  {diagnosis.recommendations.map((rec, index) => (
                    <div key={index} className="p-4 bg-gray-50 rounded-2xl border border-gray-200 space-y-1">
                      <div className="flex justify-between items-center">
                        <span className="text-xs font-bold px-2.5 py-1 bg-[#3E1F47] text-white rounded-md">{rec.category}</span>
                        <span className="text-sm font-extrabold text-[#3E1F47]">{rec.action}</span>
                      </div>
                      <p className="text-xs text-gray-600 mt-2">{rec.details}</p>
                    </div>
                  ))}
                </div>

                <button 
                  onClick={resetForm}
                  className="w-full bg-gray-100 text-gray-700 py-3 rounded-xl font-bold hover:bg-gray-200 transition-all cursor-pointer text-sm"
                >
                  Log Another Shot
                </button>
              </section>
            )}
          </React.Fragment>
          )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
